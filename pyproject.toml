[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xetra-loader"
version = "0.1.0"
description = "Deterministic XETRA market-data loader with Bronze/Silver/Gold medallion storage and PostgreSQL publication."
readme = "README.md"
requires-python = "==3.14.7"
authors = [{ name = "Sergej Schweizer" }]
license = { text = "Proprietary" }
dependencies = [
  "polars>=1.0,<3",
  "psycopg[binary]>=3.2",
  "PyYAML>=6.0",
]

[project.scripts]
xdl-weekly = "xetra_loader.pipeline.runner:main"
xdl-api = "xetra_loader.api.runner:main"
xdl-enqueue-weekly = "xetra_loader.api.enqueue:main"
xdl-bootstrap = "xetra_loader.ops.bootstrap_cli:main"
xdl-migrate = "xetra_loader.ops.migrate:main"
xdl-verify-production-sync = "xetra_loader.ops.verify_cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xetra_loader"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "C90", # McCabe complexity
    "PLR", # Pylint refactoring rules
    "TID", # Tidy imports
]
# Numeric thresholds are domain values and are documented at their call sites;
# enforcing a named constant for every test fixture and statistical cutoff adds
# noise without improving the contract.
ignore = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["xetra_loader"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests that exercise external service boundaries or a real PostgreSQL instance",
]
