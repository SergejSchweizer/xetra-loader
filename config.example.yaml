# Copy this file to config.yaml and replace the placeholders locally.
# config.yaml is ignored by Git and must never be committed.

eodhd:
  api_token: "replace-with-eodhd-api-token"

postgres:
  database: "xetra_loader"
  # Weekly publication: non-superuser xetra_data_loader_writer only.
  writer_dsn: "postgresql://xetra_data_loader_writer:replace-writer-password@10.10.1.3:54321/xetra_loader"
  # Bootstrap, migrations and controlled reset only; never used by xdl-weekly.
  admin_dsn: "postgresql://dbadmin:replace-admin-password@10.10.1.3:54321/xetra_loader"
  # Feature refresh budget per PostgreSQL operation/worker; valid range 16MB-4GB.
  feature_work_mem: "256MB"
  # Feature refresh spill cap per PostgreSQL process; valid range 1GB-64GB.
  feature_temp_file_limit: "32GB"

medallion:
  root: "./lake"

weekly:
  # One bounded CPU/concurrency budget shared by Polars and provider fetches.
  cores: 6

api:
  # Required bearer token; keep the real value only in ignored config.yaml.
  token: "replace-with-a-long-random-api-token"
  base_url: "http://127.0.0.1:8765"
